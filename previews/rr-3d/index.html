<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Robo Runner 3D (private preview)</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Figtree:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--b:#f5e4cc;--n:#12294a;--g:#e0b552}
html,body{margin:0;height:100%;overflow:hidden;background:#12294a;color:var(--b);font-family:"Lilita One",Figtree,system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
#cv{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block}
[hidden]{display:none!important}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));text-align:center;pointer-events:none}
.scr > *{pointer-events:auto}
.logo{font-size:clamp(3rem,10vw,7rem);line-height:.9;color:var(--g);-webkit-text-stroke:6px var(--n);paint-order:stroke fill;letter-spacing:.02em}
.logo small{display:block;font-size:.42em;color:var(--b)}
.kick{background:var(--n);color:var(--b);border-radius:999px;padding:4px 16px;font-size:1rem;letter-spacing:.08em}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
button{font-family:inherit;cursor:pointer}
.bt{border:4px solid var(--n);border-bottom-width:9px;border-radius:14px;background:var(--b);color:var(--n);padding:8px 28px 5px;font-size:1.6rem;letter-spacing:.05em}
.bt.main{background:var(--g)}
.bt:active{transform:translateY(3px);border-bottom-width:6px}
.keys{background:rgba(18,41,74,.85);border-radius:10px;padding:6px 12px;font:800 .82rem Figtree,system-ui,sans-serif;letter-spacing:.02em}
#title{justify-content:flex-end;padding-bottom:8vh}
#garage{justify-content:flex-end;padding-bottom:6vh}
.g-row{display:flex;align-items:center;gap:16px}
.g-arrow{width:58px;height:58px;border:4px solid var(--n);border-radius:14px;background:var(--b);color:var(--n);font-size:2rem;line-height:1}
.g-info{min-width:min(420px,60vw);background:rgba(18,41,74,.9);border:3px solid var(--b);border-radius:16px;padding:10px 16px}
#g-name{font-size:2.2rem;color:var(--g);line-height:1}
#g-power{font:800 1rem Figtree,system-ui,sans-serif;margin-top:6px}
#g-count{font:800 .78rem Figtree,system-ui,sans-serif;letter-spacing:.2em;opacity:.75}
#hud{position:fixed;inset:0;pointer-events:none}
.pill{background:rgba(18,41,74,.88);border:3px solid var(--b);border-radius:999px;padding:3px 14px;display:inline-flex;align-items:center;gap:8px;font-size:1.25rem}
.tl{position:absolute;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));display:flex;gap:6px;flex-wrap:wrap;align-items:center;max-width:46vw}
.score{display:flex;flex-direction:column;align-items:center;border-radius:18px;padding:2px 16px}
.score small{font-size:.7rem;color:var(--g);letter-spacing:.08em}
.score b{font-weight:400;font-size:1.6rem;line-height:1}
.ic{width:16px;height:16px;border-radius:50%;background:var(--g);border:2px solid var(--n);display:inline-block}
.ic.st{border-radius:2px;transform:rotate(45deg);width:12px;height:12px}
.ic.mg{border-radius:2px;background:var(--b);width:12px;height:16px}
.lv{position:absolute;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);text-align:center;width:min(360px,40vw)}
.lv b{display:inline-block;background:var(--g);color:var(--n);border:3px solid var(--n);border-radius:8px;padding:2px 12px;font-weight:400;font-size:1rem;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.bar{height:12px;background:rgba(18,41,74,.88);border:3px solid var(--b);border-radius:999px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--b);border-radius:999px}
.tr{position:absolute;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));pointer-events:auto}
#b-pause{border:3px solid var(--n);background:var(--b);color:var(--n);border-radius:8px;padding:4px 12px;font-size:1rem}
#h-mult{position:absolute;right:max(12px,env(safe-area-inset-right));top:calc(max(12px,env(safe-area-inset-top)) + 46px);color:var(--g);font-size:1.6rem;-webkit-text-stroke:4px var(--n);paint-order:stroke fill}
#h-power{position:absolute;left:max(12px,env(safe-area-inset-left));top:calc(max(12px,env(safe-area-inset-top)) + 56px);color:var(--g);font-size:1rem;-webkit-text-stroke:3px var(--n);paint-order:stroke fill}
#h-state{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);color:#bfe9ff;font-size:1.15rem;-webkit-text-stroke:4px var(--n);paint-order:stroke fill;white-space:nowrap}
#h-count{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:8rem;color:var(--g);-webkit-text-stroke:8px var(--n);paint-order:stroke fill}
#pops{position:absolute;left:50%;top:26%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px}
.pop{font-size:1.4rem;color:var(--b);-webkit-text-stroke:4px var(--n);paint-order:stroke fill;animation:popup 1.3s ease-out forwards;white-space:nowrap}
.pop.big{font-size:2.1rem;color:var(--g)}
@keyframes popup{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.12)}22%{transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-24px)}}
#banner{position:absolute;left:0;right:0;top:22%;text-align:center;opacity:0;background:rgba(18,41,74,.72);padding:10px 12px}
#banner.on{animation:ban 3s ease-out forwards}
#banner small{display:block;font-size:2.6rem;color:var(--g);-webkit-text-stroke:5px var(--n);paint-order:stroke fill;line-height:1}
#banner b{display:block;font-weight:400;font-size:1.6rem}
#banner span{display:block;font:800 .95rem Figtree,system-ui,sans-serif}
@keyframes ban{0%{opacity:0;transform:scaleY(.2)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#pause,#over{background:rgba(18,41,74,.6)}
.card{background:var(--b);color:var(--n);border:5px solid var(--n);border-bottom-width:12px;border-radius:20px;padding:16px 26px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:min(380px,86vw)}
.card .why{font-size:2.6rem;color:var(--n)}
.card .big{font-size:3.6rem;line-height:1;color:var(--n)}
.card .sm{font:800 1rem Figtree,system-ui,sans-serif}
.card .gold{color:#a77a2a}
#pad{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:8px max(10px,env(safe-area-inset-left)) max(10px,env(safe-area-inset-bottom))}
#pad button{flex:1;border:4px solid var(--n);border-bottom-width:8px;background:var(--b);color:var(--n);border-radius:12px;padding:10px 0;font-size:1.15rem;touch-action:none}
#pad button.big{flex:1.5;background:var(--g)}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--n);font-size:1.6rem;color:var(--g)}
.priv{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));font:800 .62rem Figtree,system-ui,sans-serif;letter-spacing:.2em;opacity:.6;pointer-events:none}
@media (max-width:700px){.lv{top:calc(max(12px,env(safe-area-inset-top)) + 96px);width:70vw}.tl{max-width:70vw}.pill{font-size:1rem}.score b{font-size:1.25rem}#h-state{bottom:calc(max(14px,env(safe-area-inset-bottom)) + 74px);font-size:.95rem}#h-power{top:calc(max(12px,env(safe-area-inset-top)) + 140px)}#h-mult{top:calc(max(12px,env(safe-area-inset-top)) + 140px)}.priv{bottom:calc(max(10px,env(safe-area-inset-bottom)) + 74px)}}
</style></head><body>
<canvas id="cv"></canvas>
<div id="loading">LOADING...</div>
<div class="scr" id="title">
  <div class="logo">ROBO RUNNER<small>NOW IN 3D</small></div>
  <div class="btns"><button class="bt main" id="b-play">PLAY</button><button class="bt" id="b-garage">GARAGE</button></div>
  <div class="keys">UP or SPACE: jump (press again to flip) &middot; LEFT: backflip &middot; DOWN: slide or drop &middot; P: pause &middot; on a phone use the buttons or swipe</div>
</div>
<div class="scr" id="garage" hidden>
  <div class="kick">GARAGE</div>
  <div class="g-row"><button class="g-arrow" id="g-prev" aria-label="Previous skin">&#8249;</button><div class="g-info"><div id="g-count"></div><div id="g-name"></div><div id="g-power"></div></div><button class="g-arrow" id="g-next" aria-label="Next skin">&#8250;</button></div>
  <div class="btns"><button class="bt main" id="g-done">WEAR IT</button></div>
</div>
<div id="hud" hidden>
  <div class="tl"><div class="pill score"><small>SCORE</small><b id="h-score">0</b></div><div class="pill"><i class="ic"></i><span id="h-coins">0</span></div><div class="pill"><i class="ic st"></i><span id="h-stars">0</span></div><div class="pill"><i class="ic mg"></i><span id="h-mags">0</span></div></div>
  <div class="lv"><b id="h-level"></b><div class="bar"><i id="h-prog"></i></div></div>
  <div class="tr"><button id="b-pause">PAUSE</button></div>
  <div id="h-mult"></div><div id="h-power"></div><div id="h-state"></div>
  <div id="h-count"></div><div id="pops"></div><div id="banner"></div>
</div>
<div id="pad" hidden><button data-k="slide">SLIDE</button><button data-k="flip">FLIP</button><button class="big" data-k="jump">JUMP</button></div>
<div class="scr" id="pause" hidden><div class="card"><div class="why">PAUSED</div><div class="btns"><button class="bt main" id="p-go">KEEP GOING</button><button class="bt" id="p-quit">MENU</button></div></div></div>
<div class="scr" id="over" hidden><div class="card"><div class="why" id="o-why">CRASH!</div><div class="big" id="o-score">0</div><div class="sm gold" id="o-best"></div><div class="sm" id="o-coins"></div><div class="btns"><button class="bt main" id="o-again">PLAY AGAIN</button><button class="bt" id="o-garage">GARAGE</button><button class="bt" id="o-menu">MENU</button></div></div></div>
<div class="priv">PRIVATE PREVIEW</div>

<script>
/* ROBO RUNNER 3D (private mock-up). A night run through the NeshamaGazine port, in the rain. */
(function(){
'use strict';
var COVERS = window.R3D_COVERS || [];
var $ = function(id){ return document.getElementById(id); };
var mobile = matchMedia('(pointer:coarse)').matches || innerWidth < 760;

// ---------------- renderer, scene, camera ----------------
var canvas = $('cv');
var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: !mobile, powerPreference: 'high-performance' });
var PR = Math.min(2, window.devicePixelRatio || 1);
renderer.setPixelRatio(PR);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.78;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
var scene = new THREE.Scene();
var FOG = new THREE.Color('#141c29');
scene.fog = new THREE.FogExp2(FOG, 0.02);
scene.background = FOG.clone();
var camera = new THREE.PerspectiveCamera(62, 16 / 9, 0.1, 900);
camera.position.set(0, 3.4, 7.2);
var pmrem = new THREE.PMREMGenerator(renderer);
var envTex = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04).texture;
scene.environment = envTex;

var composer = null, bloom = null;
function setupBloom(){
  if (mobile || !THREE.EffectComposer) return;
  composer = new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene, camera));
  bloom = new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.7, 0.5, 0.93);
  composer.addPass(bloom);
  composer.addPass(new THREE.ShaderPass(THREE.GammaCorrectionShader));
  renderer.outputEncoding = THREE.LinearEncoding;
}
setupBloom();
function resize(){
  var w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  camera.fov = w / h < 1 ? 78 : 62; camera.updateProjectionMatrix();
  if (composer){ composer.setSize(w, h); }
}
addEventListener('resize', resize); resize();

// ---------------- textures made in code ----------------
function cvs(w, h, fn){ var c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h); return c; }
function tex(c, rx, ry, srgb){ var t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx || 1, ry || 1); t.anisotropy = 8; if (srgb !== false) t.encoding = THREE.sRGBEncoding; return t; }
function rnd(a, b){ return a + Math.random() * (b - a); }
// wet asphalt

var SPAWN_X = 46;

// ---------------- controls ----------------
function play(){ return mode === 'play' && S && !S.dead && !paused; }
function jump(){ if (!play() || S.count > .45) return; if (S.rocket > 0 || S.eject > 0 || S.chute || S.slip > 0) return;
  if (S.y <= .02 && !S.air){ S.vy = 11.2; S.air = 1; S.slide = 0; sfx(320, 700, .14, .05); burst(0, .1, 0, 8, '#f5e4cc', 2); }
  else if (S.air < S.maxAir){ S.vy = 10.2; S.air++; S.flipDir = 1; S.flip = 0; sfx(520, 1040, .2, .05); } }
function backflip(){ if (!play() || S.count > .45) return; if (S.rocket > 0 || S.eject > 0 || S.chute || S.slip > 0) return;
  if (S.y <= .02 && !S.air){ S.vy = 11; S.air = S.maxAir; S.flipDir = -1; S.flip = 0; sfx(760, 380, .25, .05); }
  else if (S.air < S.maxAir){ S.vy = 10; S.air = S.maxAir; S.flipDir = -1; S.flip = 0; sfx(760, 380, .25, .05); } }
function down(){ if (!play()) return;
  if (S.rocket > 0){ S.rocket = .0001; S.dropNow = true; return; }
  if (S.chute || S.eject > 0){ S.chute = 0; S.eject = 0; S.dive = true; S.vy = -26; return; }
  if (S.y > .05){ S.dive = true; S.vy = -24; } else if (S.slip <= 0){ S.slide = .8; sfx(200, 120, .2, .04); } }
function setPause(v){ if (mode !== 'play') v = false; paused = v; $('pause').hidden = !v; hold = false; }
addEventListener('keydown', function(e){ var k = e.key;
  if (k === 'p' || k === 'P' || k === 'Escape'){ if (mode === 'play') setPause(!paused); return; }
  if (mode !== 'play'){ if ((k === 'Enter' || k === ' ') && mode === 'title'){ e.preventDefault(); start(); } return; }
  if (k === 'ArrowUp' || k === 'w' || k === 'W' || k === ' ' || k === 'ArrowRight' || k === 'd' || k === 'D'){ e.preventDefault(); hold = true; if (!e.repeat) jump(); }
  else if (k === 'ArrowLeft' || k === 'a' || k === 'A'){ e.preventDefault(); if (!e.repeat) backflip(); }
  else if (k === 'ArrowDown' || k === 's' || k === 'S'){ e.preventDefault(); holdDown = true; if (!e.repeat) down(); } });
addEventListener('keyup', function(e){ if (/^(ArrowUp|ArrowRight|w|W|d|D| )$/.test(e.key)) hold = false; if (/^(ArrowDown|s|S)$/.test(e.key)) holdDown = false; });
var tx0 = null, ty0 = 0;
canvas.addEventListener('pointerdown', function(e){ tx0 = e.clientX; ty0 = e.clientY; hold = true; });
addEventListener('pointerup', function(e){ hold = false; if (tx0 == null) return; var dx = e.clientX - tx0, dy = e.clientY - ty0; tx0 = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 26){ jump(); return; }
  if (Math.abs(dy) > Math.abs(dx)){ if (dy > 0) down(); else jump(); } else if (dx < 0) backflip(); else jump(); });
document.querySelectorAll('[data-k]').forEach(function(b){ b.addEventListener('pointerdown', function(e){ e.preventDefault(); e.stopPropagation(); var k = b.dataset.k; if (k === 'jump'){ hold = true; jump(); } else if (k === 'slide') down(); else backflip(); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(function(ev){ b.addEventListener(ev, function(){ hold = false; }); }); });

// ---------------- sound ----------------
var AC = null; function sfx(f1, f2, d, v, type){ try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); var o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime; o.type = type || 'square'; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t + d); g.gain.setValueAtTime(v || .04, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .02); } catch(e){} }

// ---------------- HUD ----------------
var popEl = $('pops');

// ---------------- spawning (same patterns as the 2D game) ----------------

  else if (k === 'tall') t = add({ k: 'tall', x: x });
  else if (k === 'plane') t = add({ k: 'plane', x: x, y: 1.25 + Math.random() * .3, extra: 3 });
  else if (k === 'bolt') t = add({ k: 'bolt', x: x, extra: 4 + S.lv * .2 });
  else if (k === 'fork') t = add({ k: 'fork', x: x, extra: 3.2 });
  else if (k === 'spring') t = add({ k: 'spring', x: x });
  else if (k === 'peel') t = add({ k: 'peel', x: x });
  else if (k === 'ink') t = add({ k: 'ink', x: x });
  else if (k === 'gap') t = add({ k: 'gap', x: x, w: 2.2 + Math.min(1.4, S.lv * .12) });
  else if (k === 'laser') t = add({ k: 'laser', x: x, ph: Math.random() * 2 });
  else if (k === 'sign') t = add({ k: 'sign', x: x });
  else if (k === 'gear') t = add({ k: 'gear', x: x, extra: 4.5 + S.lv * .2 });

  else if (r < .6) add({ k: 'plane', x: x, y: 1.5 + Math.random() * 6, extra: 3 });
  else { var h0 = 2 + Math.random() * 5; for (var i = 0; i < 7; i++) add({ k: 'coin', x: x + i * .8, y: h0 + Math.sin(i / 2) * .6 }); }
  if (Math.random() < .1) add({ k: 'mag', x: x + 3, y: 2 + Math.random() * 5 }); }

// ---------------- scoring ----------------
function gain(base, label){ S.chain++; S.chainT = 1.4; S.mult = Math.min(5, 1 + Math.floor(S.chain / 5)); var p = base * S.mult; S.pts += p; if (label) pop(label + ' +' + p, true); }
function fill(n){ if (S.rocket > 0) return; if (has('turbo')) n *= 2; S.meter += n; if (S.meter >= 30){ S.meter = 0; launch(); } }
function launch(){ S.rocket = 6 + (has('turbo') ? 4 : 0); S.vy = 0; S.flipDir = 0; S.slide = 0; S.slip = 0; S.chute = 0; S.eject = 0; S.dive = false; S.air = 0;
  R.shells.forEach(function(sh, i){ sh.position.set(0, 1.1, 0); sh.rotation.set(0, i ? -Math.PI / 2 : Math.PI / 2, 0); }); S.shells = null;
