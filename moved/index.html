<style>
  :root{ --navy:#12294a; --beige:#f5e4cc; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; min-height:100%; }
  body{ background:var(--beige); color:var(--navy); font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; padding:20px 16px 28px; min-height:100vh; }
  .pic{ display:block; width:100%; max-width:1000px; border:3px solid var(--navy); border-radius:16px; overflow:hidden; line-height:0; }
  .pic img{ width:100%; height:auto; display:block; }
  .box{ width:100%; max-width:1000px; display:flex; align-items:center; gap:18px; flex-wrap:wrap; justify-content:center; text-align:center; }
  .num{ flex:0 0 auto; width:84px; height:84px; border-radius:50%; background:var(--navy); color:var(--beige); font-size:44px; font-weight:800; display:grid; place-items:center; font-variant-numeric:tabular-nums; }
  .txt{ flex:1 1 260px; min-width:0; font-size:clamp(18px,2.6vw,26px); font-weight:800; line-height:1.25; text-align:left; }
  .txt small{ display:block; font-size:.62em; font-weight:600; opacity:.8; margin-top:4px; }
  .go{ flex:0 0 auto; background:var(--navy); color:var(--beige); text-decoration:none; font-weight:800; font-size:18px; padding:16px 26px; border-radius:999px; border:3px solid var(--navy); }
  .go:hover,.go:focus-visible{ background:var(--beige); color:var(--navy); outline:none; }
  .bar{ width:100%; max-width:1000px; height:10px; border:2px solid var(--navy); border-radius:99px; overflow:hidden; }
  .bar i{ display:block; height:100%; width:0; background:var(--navy); }
  @media (max-width:560px){ .txt{ text-align:center; } }
  @media (prefers-reduced-motion:no-preference){ .bar i{ transition:width 1s linear; } }
